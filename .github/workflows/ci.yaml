name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────
  # Client — Install, Lint, Test, Build
  # ─────────────────────────────────────────────
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Run linter
        run: npm run lint
        working-directory: client

      - name: Run tests
        run: npm run test -- --run
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

  # ─────────────────────────────────────────────
  # Server — Install, Lint, Test (Health + CRUD)
  # ─────────────────────────────────────────────
  server:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run linter
        run: npm run lint
        working-directory: server

      - name: Run tests
        run: npm test
        working-directory: server
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/shopsmart_test