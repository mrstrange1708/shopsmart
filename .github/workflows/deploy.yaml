# ══════════════════════════════════════════════════════════════
# ShopSmart — Unified CI/CD Pipeline
# Phase 1: Testing → Phase 2: Terraform → Docker Build → Phase 3: EKS Deploy
# ══════════════════════════════════════════════════════════════

name: Deploy Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CLUSTER_NAME: shopsmart-devops

jobs:
  # ─────────────────────────────────────────────────────────────
  # PHASE 1 — Testing
  # Run unit + integration tests, generate reports
  # ─────────────────────────────────────────────────────────────
  test:
    name: "Phase 1 — Run Tests"
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # ─── Server Tests ──────────────────────────────────────
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server unit tests (Jest)
        run: npm test -- --ci --reporters=default --reporters=jest-junit 2>/dev/null || npm test
        working-directory: server
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/shopsmart_test

      # ─── Client Tests ──────────────────────────────────────
      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Run client unit tests (Vitest)
        run: npm run test -- --run --reporter=verbose --exclude='src/App.integration.test.jsx' --exclude='tests/**' 2>/dev/null || npm run test -- --run --exclude='src/App.integration.test.jsx' --exclude='tests/**'
        working-directory: client

      - name: Build client (verify build works)
        run: npm run build
        working-directory: client

      # ─── Upload Test Reports ───────────────────────────────
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            server/test-results/
            client/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # PHASE 2 — Infrastructure Provisioning (Terraform)
  # Initialize, validate, plan, apply
  # ─────────────────────────────────────────────────────────────
  terraform:
    name: "Phase 2 — Terraform Apply"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      ecr_server_url: ${{ steps.tf_outputs.outputs.ecr_server_url }}
      ecr_client_url: ${{ steps.tf_outputs.outputs.ecr_client_url }}
      cluster_name: ${{ steps.tf_outputs.outputs.cluster_name }}
      region: ${{ steps.tf_outputs.outputs.region }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -var="aws_region=${{ secrets.AWS_REGION }}" -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Export Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "ecr_server_url=$(terraform output -raw ecr_server_url)" >> $GITHUB_OUTPUT
          echo "ecr_client_url=$(terraform output -raw ecr_client_url)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "region=$(terraform output -raw region)" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # Docker Build & Push to ECR
  # ─────────────────────────────────────────────────────────────
  docker:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    needs: terraform

    outputs:
      server_image: ${{ steps.build.outputs.server_image }}
      client_image: ${{ steps.build.outputs.client_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Images
        id: build
        env:
          ECR_SERVER_URL: ${{ needs.terraform.outputs.ecr_server_url }}
          ECR_CLIENT_URL: ${{ needs.terraform.outputs.ecr_client_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # ─── Server Image ──────────────────────────────────
          echo "Building server image..."
          docker build -t $ECR_SERVER_URL:$IMAGE_TAG -t $ECR_SERVER_URL:latest ./server
          docker push $ECR_SERVER_URL:$IMAGE_TAG
          docker push $ECR_SERVER_URL:latest
          echo "server_image=$ECR_SERVER_URL:$IMAGE_TAG" >> $GITHUB_OUTPUT

          # ─── Client Image ──────────────────────────────────
          echo "Building client image..."
          docker build -t $ECR_CLIENT_URL:$IMAGE_TAG -t $ECR_CLIENT_URL:latest ./client
          docker push $ECR_CLIENT_URL:$IMAGE_TAG
          docker push $ECR_CLIENT_URL:latest
          echo "client_image=$ECR_CLIENT_URL:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # PHASE 3 — Deploy to EKS
  # Configure cluster, apply manifests, verify rollout
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "Phase 3 — Deploy to EKS"
    runs-on: ubuntu-latest
    needs: [terraform, docker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ─── Configure kubectl for EKS ────────────────────────
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.terraform.outputs.cluster_name }} \
            --region ${{ needs.terraform.outputs.region }}

      # ─── Create namespace + config ────────────────────────
      - name: Apply namespace and configmap
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      # ─── Create Kubernetes Secret for MONGO_URI ────────────
      - name: Create MongoDB secret
        run: |
          kubectl create secret generic shopsmart-secrets \
            --namespace=shopsmart \
            --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # ─── Replace image placeholders and apply ──────────────
      - name: Deploy server
        env:
          SERVER_IMAGE: ${{ needs.docker.outputs.server_image }}
        run: |
          sed -i "s|IMAGE_PLACEHOLDER_SERVER|$SERVER_IMAGE|g" k8s/server-deployment.yaml
          kubectl apply -f k8s/server-deployment.yaml
          kubectl apply -f k8s/server-service.yaml

      - name: Deploy client
        env:
          CLIENT_IMAGE: ${{ needs.docker.outputs.client_image }}
        run: |
          sed -i "s|IMAGE_PLACEHOLDER_CLIENT|$CLIENT_IMAGE|g" k8s/client-deployment.yaml
          kubectl apply -f k8s/client-deployment.yaml
          kubectl apply -f k8s/client-service.yaml

      # ─── Wait for rollout ──────────────────────────────────
      - name: Wait for server rollout
        run: |
          kubectl rollout status deployment/shopsmart-server \
            --namespace=shopsmart --timeout=300s

      - name: Wait for client rollout
        run: |
          kubectl rollout status deployment/shopsmart-client \
            --namespace=shopsmart --timeout=300s

      # ─── Print deployment info ─────────────────────────────
      - name: Deployment Summary
        run: |
          echo "════════════════════════════════════════════════"
          echo "  ShopSmart Deployment Complete!"
          echo "════════════════════════════════════════════════"
          echo ""
          echo "── Pods ──"
          kubectl get pods -n shopsmart -o wide
          echo ""
          echo "── Services ──"
          kubectl get svc -n shopsmart
          echo ""
          echo "── LoadBalancer Endpoint ──"
          kubectl get svc shopsmart-client -n shopsmart \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || \
            echo "(pending — may take 1-2 minutes for AWS ELB provisioning)"
          echo ""
          echo "════════════════════════════════════════════════"
