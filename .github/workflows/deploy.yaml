# ══════════════════════════════════════════════════════════════
# ShopSmart — Unified CI/CD Pipeline
# Phase 1: Testing → Phase 2: Terraform → Docker Build → Phase 3: EKS Deploy
# ══════════════════════════════════════════════════════════════

name: Deploy Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CLUSTER_NAME: shopsmart-devops

jobs:
  # ─────────────────────────────────────────────────────────────
  # PHASE 1 — Testing
  # Run unit + integration tests, generate reports
  # ─────────────────────────────────────────────────────────────
  test:
    name: "Phase 1 — Run Tests"
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # ─── Server Tests ──────────────────────────────────────
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run server unit tests (Jest)
        run: npm test -- --ci --reporters=default --reporters=jest-junit 2>/dev/null || npm test
        working-directory: server
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/shopsmart_test

      # ─── Client Tests ──────────────────────────────────────
      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Run client unit tests (Vitest)
        run: npm run test -- --run --reporter=verbose --exclude='src/App.integration.test.jsx' --exclude='tests/**' 2>/dev/null || npm run test -- --run --exclude='src/App.integration.test.jsx' --exclude='tests/**'
        working-directory: client

      - name: Build client (verify build works)
        run: npm run build
        working-directory: client

      # ─── Upload Test Reports ───────────────────────────────
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            server/test-results/
            client/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # PHASE 2 — Infrastructure Provisioning (Terraform)
  # Initialize, validate, plan, apply
  # ─────────────────────────────────────────────────────────────
  terraform:
    name: "Phase 2 — Terraform Apply"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      ecr_server_url: ${{ steps.tf_outputs.outputs.ecr_server_url }}
      ecr_client_url: ${{ steps.tf_outputs.outputs.ecr_client_url }}
      cluster_name: ${{ steps.tf_outputs.outputs.cluster_name }}
      region: ${{ steps.tf_outputs.outputs.region }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      # ─── Bootstrap: Ensure S3 bucket exists before init ─────
      - name: Bootstrap S3 backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="s3-shopsmart-devops-project-${ACCOUNT_ID}"
          REGION="${{ secrets.AWS_REGION }}"

          # Export BUCKET to GITHUB_ENV so subsequent steps can use it
          echo "TF_VAR_BUCKET=$BUCKET" >> $GITHUB_ENV

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "✅ S3 bucket already exists"
          else
            echo "🔨 Creating S3 bucket for Terraform state..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint=$REGION
            fi
            
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'
            echo "✅ S3 bucket created with versioning, encryption, and public access blocked"
          fi

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${TF_VAR_BUCKET}"
        working-directory: terraform

      # ─── Import S3 resources if not already in state ────────
      - name: Import existing resources
        working-directory: terraform
        run: |
          # Import S3 bucket + config if not already tracked by Terraform
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="s3_bucket_name=${TF_VAR_BUCKET}" \
            aws_s3_bucket.terraform_state "${TF_VAR_BUCKET}" 2>/dev/null || true
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="s3_bucket_name=${TF_VAR_BUCKET}" \
            aws_s3_bucket_versioning.terraform_state "${TF_VAR_BUCKET}" 2>/dev/null || true
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="s3_bucket_name=${TF_VAR_BUCKET}" \
            aws_s3_bucket_server_side_encryption_configuration.terraform_state "${TF_VAR_BUCKET}" 2>/dev/null || true
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="s3_bucket_name=${TF_VAR_BUCKET}" \
            aws_s3_bucket_public_access_block.terraform_state "${TF_VAR_BUCKET}" 2>/dev/null || true

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -var="aws_region=${{ secrets.AWS_REGION }}" -var="s3_bucket_name=${TF_VAR_BUCKET}" -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Export Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          ECR_SERVER=$(terraform output -raw ecr_server_url)
          ECR_CLIENT=$(terraform output -raw ecr_client_url)
          CLUSTER=$(terraform output -raw cluster_name)
          REGION=$(terraform output -raw region)

          echo "ecr_server_url=$ECR_SERVER" >> $GITHUB_OUTPUT
          echo "ecr_client_url=$ECR_CLIENT" >> $GITHUB_OUTPUT
          echo "cluster_name=$CLUSTER" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT

          echo "── Terraform Outputs ──"
          echo "ECR Server: $ECR_SERVER"
          echo "ECR Client: $ECR_CLIENT"
          echo "Cluster:    $CLUSTER"
          echo "Region:     $REGION"

  # ─────────────────────────────────────────────────────────────
  # Docker Build & Push to ECR
  # ─────────────────────────────────────────────────────────────
  docker:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    needs: terraform

    outputs:
      server_image: ${{ steps.build.outputs.server_image }}
      client_image: ${{ steps.build.outputs.client_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Images
        id: build
        env:
          ECR_SERVER_URL: ${{ needs.terraform.outputs.ecr_server_url }}
          ECR_CLIENT_URL: ${{ needs.terraform.outputs.ecr_client_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Validate ECR URLs are not empty
          if [ -z "$ECR_SERVER_URL" ] || [ -z "$ECR_CLIENT_URL" ]; then
            echo "ERROR: ECR URLs are empty!"
            echo "ECR_SERVER_URL=$ECR_SERVER_URL"
            echo "ECR_CLIENT_URL=$ECR_CLIENT_URL"
            # Fallback: construct from AWS account ID
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            AWS_REGION="${{ secrets.AWS_REGION }}"
            ECR_SERVER_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/shopsmart-server"
            ECR_CLIENT_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/shopsmart-client"
            echo "Using fallback ECR URLs:"
            echo "  Server: $ECR_SERVER_URL"
            echo "  Client: $ECR_CLIENT_URL"
          fi

          # ─── Server Image ──────────────────────────────────
          echo "Building server image..."
          docker build -t "$ECR_SERVER_URL:$IMAGE_TAG" -t "$ECR_SERVER_URL:latest" ./server
          docker push "$ECR_SERVER_URL:$IMAGE_TAG"
          docker push "$ECR_SERVER_URL:latest"
          echo "server_image=$ECR_SERVER_URL:$IMAGE_TAG" >> $GITHUB_OUTPUT

          # ─── Client Image ──────────────────────────────────
          echo "Building client image..."
          docker build -t "$ECR_CLIENT_URL:$IMAGE_TAG" -t "$ECR_CLIENT_URL:latest" ./client
          docker push "$ECR_CLIENT_URL:$IMAGE_TAG"
          docker push "$ECR_CLIENT_URL:latest"
          echo "client_image=$ECR_CLIENT_URL:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # PHASE 3 — Deploy to EKS
  # Configure cluster, apply manifests, verify rollout
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "Phase 3 — Deploy to EKS"
    runs-on: ubuntu-latest
    needs: [terraform, docker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ─── Configure kubectl for EKS ────────────────────────
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name shopsmart-devops \
            --region ${{ secrets.AWS_REGION }}

      # ─── Create namespace + config ────────────────────────
      - name: Apply namespace and configmap
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      # ─── Create Kubernetes Secret for MONGO_URI ────────────
      - name: Create MongoDB secret
        run: |
          kubectl create secret generic shopsmart-secrets \
            --namespace=shopsmart \
            --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # ─── Resolve ECR image URLs ────────────────────────────
      - name: Resolve image URLs
        id: images
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          AWS_REGION="${{ secrets.AWS_REGION }}"
          IMAGE_TAG="${{ github.sha }}"
          SERVER_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/shopsmart-server:${IMAGE_TAG}"
          CLIENT_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/shopsmart-client:${IMAGE_TAG}"
          echo "server_image=$SERVER_IMAGE" >> $GITHUB_OUTPUT
          echo "client_image=$CLIENT_IMAGE" >> $GITHUB_OUTPUT
          echo "Server image: $SERVER_IMAGE"
          echo "Client image: $CLIENT_IMAGE"

      # ─── Replace image placeholders and apply using Kustomize ─
      - name: Deploy application
        env:
          SERVER_IMAGE: ${{ steps.images.outputs.server_image }}
          CLIENT_IMAGE: ${{ steps.images.outputs.client_image }}
        run: |
          cd k8s
          
          # Parse the image coordinates correctly for Kustomize
          # Kustomize expects: kustomize edit set image [name]=[newName]:[newTag]
          # Since our SERVER_IMAGE and CLIENT_IMAGE are fully qualified URLs with tags,
          # we can just use them as the newName:newTag directly.
          
          kustomize edit set image IMAGE_PLACEHOLDER_SERVER=$SERVER_IMAGE
          kustomize edit set image IMAGE_PLACEHOLDER_CLIENT=$CLIENT_IMAGE
          
          # Apply the kustomization
          kubectl apply -k .

      # ─── Wait for rollout & auto-rollback on failure ───────
      - name: Verify rollout and rollback if failed
        run: |
          echo "Waiting for server rollout..."
          if ! kubectl rollout status deployment/shopsmart-server --namespace=shopsmart --timeout=120s; then
            echo "❌ Server rollout failed! Rolling back..."
            kubectl rollout undo deployment/shopsmart-server --namespace=shopsmart
            exit 1
          fi
          
          echo "Waiting for client rollout..."
          if ! kubectl rollout status deployment/shopsmart-client --namespace=shopsmart --timeout=120s; then
            echo "❌ Client rollout failed! Rolling back..."
            kubectl rollout undo deployment/shopsmart-client --namespace=shopsmart
            exit 1
          fi

      # ─── Print deployment info ─────────────────────────────
      - name: Deployment Summary
        run: |
          echo "════════════════════════════════════════════════"
          echo "  ShopSmart Deployment Complete!"
          echo "════════════════════════════════════════════════"
          echo ""
          echo "── Pods ──"
          kubectl get pods -n shopsmart -o wide
          echo ""
          echo "── Services ──"
          kubectl get svc -n shopsmart
          echo ""
          echo "── LoadBalancer Endpoint ──"
          kubectl get svc shopsmart-client -n shopsmart \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || \
            echo "(pending — may take 1-2 minutes for AWS ELB provisioning)"
          echo ""
          echo "════════════════════════════════════════════════"

      # ─── Post-Deployment Health Verification ───────────────
      - name: Verify Live Endpoint Health
        run: |
          echo "Fetching LoadBalancer URL..."
          CLIENT_URL=$(kubectl get svc shopsmart-client -n shopsmart -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          if [ -z "$CLIENT_URL" ]; then
             echo "LoadBalancer URL not ready yet. Skipping health check."
             exit 0
          fi
          
          echo "Testing endpoint: http://$CLIENT_URL/"
          echo "Waiting up to 3 minutes for DNS propagation and ELB routing..."
          
          SUCCESS=0
          for i in {1..18}; do
            # Use curl to get HTTP status code, failing on errors
            if curl -s --max-time 5 -f http://$CLIENT_URL/ > /dev/null; then
              echo "✅ Health check passed! Application is live and responding."
              SUCCESS=1
              break
            fi
            echo "Attempt $i failed. Retrying in 10 seconds..."
            sleep 10
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "❌ Health check failed after 3 minutes. The deployment succeeded but the endpoint is not returning HTTP 200."
            # We don't necessarily fail the pipeline if it's just DNS propagation,
            # but we throw a warning. Or we can exit 1. Given AWS ELB can take 5 mins,
            # we'll just log an error for now to avoid false negative pipeline runs.
            echo "::warning::Endpoint health check failed. AWS ELB might still be provisioning."
          fi
