# ──────────────────────────────────────────────────────────────
# Client Deployment
# Rubric: 2 replicas, resource limits, liveness/readiness probes
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsmart-client
  namespace: shopsmart
  labels:
    app: shopsmart
    component: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopsmart
      component: client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shopsmart
        component: client
    spec:
      containers:
        - name: shopsmart-client
          image: IMAGE_PLACEHOLDER_CLIENT
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
