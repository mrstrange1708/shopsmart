# ──────────────────────────────────────────────────────────────
# Nginx Configuration — SPA Routing + API Proxy
# Runs as non-root on port 8080 (nginx-unprivileged)
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ─── API Proxy ───────────────────────────────────────────
    # Routes /api/* to the backend Kubernetes service
    # This eliminates the need for VITE_API_URL at build time
    location /api/ {
        proxy_pass http://shopsmart-server.shopsmart.svc.cluster.local:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ─── SPA Fallback ────────────────────────────────────────
    # All non-file routes fall back to index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Static Asset Caching ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
